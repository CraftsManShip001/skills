<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>소개 영상</title>
<!-- 같은 폴더에 lib.js(스킬 assets/lib.js 복사)와 footage/frames.js(footage.mjs가 만듦)가 있어야 한다. -->
<script src="lib.js"></script>
<script src="footage/frames.js" onerror="window.FRAMES = {}"></script>
<style>
  /* ── 브랜드: 프로젝트의 디자인 기록에서 가져와 바꾼다 ── */
  :root { --bg: #EFEFED; --ink: #1E1E1E; --brand: #2B66D9; --dark: #141312; --on-dark: #F1EEE8; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--ink); font-family: "Apple SD Gothic Neo", "Pretendard", -apple-system, sans-serif; }
  .scene { position: absolute; inset: 0; overflow: hidden; opacity: 0; background: var(--bg); transform-origin: 50% 50%; }
  .cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }

  /* 실제 화면: 두 겹을 번갈아 써서 컷 사이를 겹쳐 넘긴다. 겹마다 그림 여러 장(빨리 감을 때 잔상). */
  .foot img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  .foot .ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 64px; font-weight: 700; color: #fff; background: linear-gradient(135deg, #8EA3BF, #3B4F6B); }

  /* 예시 장면 1 · 여는 장면: 복잡한 옛 화면이 한 점으로 빨려 들고, 그 점이 우리 도구로 펼쳐진다. 프로젝트에 맞게 다시 그린다. */
  #opener .old { position: absolute; inset: 0; background: #A3ABB6; }
  #opener .btn { position: absolute; width: 40px; height: 40px; border-radius: 4px; background: #F4F6F8; box-shadow: inset 0 0 0 1px #C3CAD3; }
  #opener .paper { position: absolute; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.15); transform-origin: 50% 50%; }
  #opener .pill { position: absolute; background: #fff; box-shadow: 0 6px 20px rgba(30,25,20,.10), 0 0 0 1px rgba(30,25,20,.06); display: flex; align-items: center; justify-content: center; gap: 18px; overflow: hidden; }
  #opener .pill i { width: 26px; height: 26px; border-radius: 7px; background: #E6E9EE; display: block; flex: none; }
  #opener .pill i.on { background: var(--brand); }

  /* 예시 장면 2 · 작은 상호작용을 크게 다시 그리기(커서·이름표·말풍선). 앱의 실제 모양·색을 소스에서 옮겨 온다. */
  #talk .doc { position: absolute; left: 200px; top: -60px; width: 1520px; height: 1300px; background: #fff; box-sizing: border-box; padding: 190px 140px 0; box-shadow: 0 30px 80px rgba(40,30,20,.08); }
  #talk .doc p { margin: 0; font-size: 44px; line-height: 1.75; }
  #talk .mark { position: relative; }
  #talk .mark b { position: absolute; left: -6px; right: -6px; top: 6px; bottom: 4px; background: var(--peer); opacity: .16; border-radius: 6px; transform-origin: 0 50%; }
  .pc { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .pc .arr { position: absolute; left: -10px; top: -7.5px; width: 60px; height: 60px; }
  .pc .pl, .pc .bub { position: absolute; left: 48px; top: 44px; color: #fff; white-space: nowrap; transform-origin: 0 0; background: var(--peer); }
  .pc .pl { padding: 6px 20px; border-radius: 8px 24px 24px 24px; font-size: 32px; font-weight: 600; }
  .pc .bub { padding: 18px 30px; border-radius: 8px 36px 36px 36px; font-size: 42px; font-weight: 500; box-sizing: border-box; overflow: hidden; }
  .pc .bub u { display: inline-block; width: 3px; height: 44px; background: #fff; vertical-align: -8px; margin-left: 3px; }

  /* 끝: 화면이 한 점으로 줄고, 그 점이 로고로 그려진다 */
  #dark { position: absolute; inset: 0; background: var(--dark); opacity: 0; }
  #dot, #endMark, #endWord { z-index: 5; }
  #dot { position: absolute; left: 946px; top: 526px; width: 28px; height: 28px; background: var(--brand); border-radius: 8px; opacity: 0; }
  #endMark { position: absolute; top: 420px; width: 240px; height: 240px; overflow: visible; opacity: 0; }
  #endWord { position: absolute; top: 452px; font-size: 168px; font-weight: 800; letter-spacing: -.03em; color: var(--on-dark); white-space: nowrap; opacity: 0; line-height: 1; }
</style>
</head>
<body>
<div id="dark"></div>

<div class="scene" id="opener"><div class="cam">
  <div class="old"></div>
  <div class="paper"></div>
  <div class="pill"></div>
</div></div>

<div class="scene foot" id="fs0"><div class="cam"></div></div>
<div class="scene foot" id="fs1"><div class="cam"></div></div>

<div class="scene" id="talk" style="--peer:#B03A6B"><div class="cam" id="talkCam">
  <div class="doc"><p>베타는 <span class="mark" id="talkMark"><b></b>12월 첫 주</span>에 연다. 초대 메일은 바다가 쓰고, 안내 문서는 하늘이 맡는다.</p></div>
  <div class="pc" id="peer"><svg class="arr" viewBox="0 0 24 24"><path d="M4 3l16 7-7 2-3 7z" fill="#B03A6B" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg><div class="pl">바다</div><div class="bub"></div></div>
</div></div>

<div id="dot"></div>
<!-- 로고: 프로젝트 로고의 path로 바꾼다(viewBox도 맞춘다). 한 붓 path면 선으로 그려진 뒤 채워진다. -->
<svg id="endMark" viewBox="0 0 48 48">
  <path id="emFill" d="M8 8h13c9.4 0 17 7.2 17 16s-7.6 16-17 16H8z" fill="#2B66D9" opacity="0"/>
  <path id="emLine" d="M8 8h13c9.4 0 17 7.2 17 16s-7.6 16-17 16H8z" fill="none" stroke="#fff" stroke-width="1.1"/>
</svg>
<div id="endWord">Brand</div>

<script>
  // 판마다 컷 목록이 따로 있다. ?v=15·30·60·90처럼 판 이름(대략의 초)을 주면 그 판을, 없으면 가장 긴 판을 찍는다.
  const V = new URLSearchParams(location.search).get("v");
  const FPS = 60;
  const TR = 0.6; // 컷 사이를 겹쳐 넘기는 시간

  // ── 컷 목록 ───────────────────────────────────────
  // 실제 화면: { clip: 장면 이름, len: 길이, from: 장면 안 시작 초 | [[컷 안 초, 장면 안 초], …](빨리 감기), speed, cam: [[진행, x, y, 배율], …] }
  // 그린 장면: { mg: 장면 id, len }   ·   cut: true 이면 겹치지 않고 바로 바꾼다(앞 컷 마지막 그림과 같은 그림으로 이어질 때).
  // 카메라 첫 키프레임을 [0, …]과 [0.05, …]로 두 번 두면, 앞 장면과 같은 그림에서 넘어오는 동안 움직이지 않는다(겹쳐 보이는 유령 방지).
  const WIDE = [[0, 960, 540, 1], [1, 940, 560, 1.06]];
  // 짧은 판은 긴 판에서 컷을 빼고 줄여 만든다. 6초 티저처럼 아주 짧은 판은 여는 장면이나 대표 컷 하나 + 로고만 둔다.
  const VERSIONS = {
    6: [{ clip: "demo", len: 2.5, from: 1, speed: 1, cam: [[0, 800, 600, 1.3], [1, 800, 600, 1.45]] }],
    15: [
      { mg: "opener", len: 4.0 },
      { clip: "demo", len: 3.0, from: 0, speed: 1, cam: [[0, 960, 540, 1], [0.1, 960, 540, 1], [1, 800, 600, 1.4]] },
      { mg: "talk", len: 3.5 },
    ],
    30: [
      { mg: "opener", len: 6.0 },
      { clip: "demo", len: 5.0, from: 0, speed: 1, cam: [[0, 960, 540, 1], [0.05, 960, 540, 1], [0.5, 760, 640, 1.4], [1, 800, 600, 1.5]] },
      { mg: "talk", len: 4.5 },
      { clip: "demo2", len: 4.0, from: [[0, 0], [1.5, 6], [4.0, 9]], speed: 1, cam: WIDE },
    ],
  };
  const SHOTS = VERSIONS[V] ?? VERSIONS[Math.max(...Object.keys(VERSIONS).map(Number))];
  const BRAND_WORD = "Brand";
  // 끝 로고 시간. 아주 짧은 판은 줄인다(로고가 그려지고 1초는 머물게).
  const OUTRO = SHOTS.reduce((a, s) => a + s.len, 0) < 8 ? 3.4 : 4.5;

  // ── 그린 장면 ──────────────────────────────────────
  // 각 장면은 draw(lt, len)으로 장면 안 시각 lt의 모습을 그린다. 처음 한 번 setup()으로 잴 것을 잰다.
  const MG = {};

  MG.opener = (() => {
    const el = $("#opener");
    const DOT = [960, 1000];
    let flyers = [];
    return {
      el,
      setup() {
        // 옛 화면: 단추 수십 개를 빽빽하게.
        const old = el.querySelector(".old");
        let html = "";
        for (let r = 0; r < 4; r += 1) for (let c = 0; c < 40; c += 1) html += `<div class="btn" style="left:${12 + c * 47.5}px;top:${12 + r * 47}px"></div>`;
        for (let r = 0; r < 18; r += 1) html += `<div class="btn" style="left:12px;top:${220 + r * 46}px;width:220px;height:36px"></div><div class="btn" style="left:1688px;top:${220 + r * 46}px;width:220px;height:36px"></div>`;
        old.insertAdjacentHTML("afterend", `<div class="olds">${html}</div>`);
        flyers = $$("#opener .olds .btn").map((b) => {
          const r = b.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
          return { b, dx: DOT[0] - cx, dy: DOT[1] - cy, d: Math.hypot(DOT[0] - cx, DOT[1] - cy) };
        });
        const far = Math.max(...flyers.map((f) => f.d));
        flyers.forEach((f) => (f.k = f.d / far));
        el.querySelector(".pill").innerHTML = Array.from({ length: 7 }, (_, i) => `<i class="${i === 2 ? "on" : ""}"></i>`).join("");
      },
      draw(lt, len) {
        const C = len * 0.3; // 빨려 들기 시작
        for (const f of flyers) {
          const k = p(lt, C + f.k * 0.7, C + f.k * 0.7 + 0.5, ease.in);
          f.b.style.transform = k > 0 ? `translate(${f.dx * k}px, ${f.dy * k}px) scale(${1 - 0.9 * k})` : "";
          f.b.style.opacity = k > 0.9 ? 0 : 1;
        }
        set(el.querySelector(".old"), { opacity: 1 - p(lt, C + 0.3, C + 1.2, ease.inOut) });
        // 좁던 종이가 숨을 쉬듯 제 크기로.
        const g = p(lt, C + 0.6, C + 1.6, ease.inOut);
        set(el.querySelector(".paper"), { left: lerp(260, 620, g) + "px", top: lerp(230, 70, g) + "px", width: lerp(1400, 680, g) + "px", height: lerp(820, 900, g) + "px" });
        // 점이 한 번 숨을 쉬고 도구 막대로 펼쳐진다.
        const born = p(lt, C + 0.2, C + 0.6), gulp = 1 + 0.18 * pulse(lt, C + 1.2, C + 1.5);
        const open = p(lt, C + 1.7, C + 2.25, ease.inOut);
        const w = lerp(44, 420, open) * (open > 0 ? 1 : born * gulp), h = lerp(44, 56, open) * (open > 0 ? 1 : born * gulp);
        set(el.querySelector(".pill"), { left: DOT[0] - w / 2 + "px", top: DOT[1] - h / 2 + "px", width: w + "px", height: h + "px", borderRadius: lerp(22, 14, open) + "px", opacity: lt > C + 0.2 ? 1 : 0 });
        $$("#opener .pill i").forEach((i, n) => set(i, { opacity: p(lt, C + 1.9 + Math.abs(n - 3) * 0.03, C + 2.2 + Math.abs(n - 3) * 0.03) }));
        // 처음엔 옛 화면 한 곳에 바짝 붙었다가 물러난다.
        const pull = p(lt, 0, C, ease.inOut);
        el.querySelector(".cam").style.transform = camStyle([lerp(500, 960, pull), lerp(120, 540, pull), lerp(2, 1, pull)]);
      },
    };
  })();

  MG.talk = (() => {
    const el = $("#talk");
    const ASK = "여기 날짜 맞아요?";
    let geo;
    return {
      el,
      setup() {
        const r = $("#talkMark").getBoundingClientRect();
        geo = { x: r.left, y: r.top, w: r.width, h: r.height, widths: prefixWidths($("#peer .bub"), ASK, "<u></u>") };
      },
      draw(lt, len) {
        const T = { fly: [0.1, 1.2], mark: [1.3, 1.7], open: 1.4, typed: 2.6, close: len - 0.5 };
        const rest = [geo.x + geo.w - 4, geo.y + geo.h - 8];
        const pt = bezier([1980, 1000], [1500, 980], rest, p(lt, T.fly[0], T.fly[1], ease.inOut));
        set("#peer", { transform: `translate(${pt[0]}px, ${pt[1]}px)` });
        set("#talkMark b", { transform: `scaleX(${p(lt, T.mark[0], T.mark[1], ease.inOut)})` });
        // 이름표가 접히고 말풍선이 튀어나와 한 글자씩 찍힌다. 풍선 너비는 글자를 따라 늘어난다.
        const k = p(lt, T.open, T.open + 0.45, ease.spring) * (1 - p(lt, T.close, T.close + 0.25, ease.inOut));
        const tag = 1 - p(lt, T.open - 0.05, T.open + 0.12, ease.inOut) + p(lt, T.close + 0.1, T.close + 0.35);
        set("#peer .pl", { transform: `scale(${clamp(tag)})`, opacity: clamp(tag * 2) });
        const c = clamp((lt - T.open - 0.15) / (T.typed - T.open - 0.15)) * ASK.length, n = Math.floor(c);
        const w = lerp(geo.widths[n], geo.widths[Math.min(ASK.length, n + 1)], ease.inOut(c - n));
        const caret = lt < T.typed + 0.4 && Math.floor(lt * 3) % 2 === 0 ? "<u></u>" : '<u style="opacity:0"></u>';
        const html = ASK.slice(0, n) + caret, bub = $("#peer .bub");
        if (bub.innerHTML !== html) bub.innerHTML = html;
        set(bub, { width: w + "px", transform: `scale(${Math.max(0, k)})`, opacity: k > 0.02 ? 1 : 0 });
        // 카메라는 커서를 따라 천천히 다가간다.
        $("#talkCam").style.transform = camStyle([lerp(geo.x + geo.w + 120, rest[0] + 200, p(lt, 0, len, ease.inOut)), geo.y + 160, lerp(1.1, 1.3, p(lt, 0, len, ease.linear))]);
      },
    };
  })();

  // ── 엔진: 아래는 보통 고칠 일이 없다 ─────────────────────────
  const FRAMES = window.FRAMES || {};
  let clock = 0, layer = 0;
  const shots = SHOTS.map((s) => {
    const shot = { ...s, start: clock, end: clock + s.len, speed: s.speed ?? 1 };
    if (s.mg) shot.el = MG[s.mg].el;
    else {
      shot.el = $("#fs" + (layer++ % 2));
      shot.map = Array.isArray(s.from) ? smoothMap(s.from) : null;
    }
    clock += s.len;
    return shot;
  });
  const END = clock;
  window.DURATION = END + OUTRO;
  $("#endWord").textContent = BRAND_WORD;

  const clipTime = (shot, t) => (shot.map ? shot.map(t - shot.start) : shot.from + (t - shot.start) * shot.speed);
  const frameSrc = (clip, ct) => `footage/${clip}/${FPS}/f${String(Math.min(FRAMES[clip], Math.max(1, Math.floor(ct * FPS) + 1))).padStart(5, "0")}.jpg`;

  // 실제 화면 한 겹: 빨리 감을 때는 셔터를 연 것처럼 몇 프레임을 겹쳐 흐르게 보인다.
  const STACK = 6;
  for (const id of ["#fs0", "#fs1"]) $(id + " .cam").innerHTML = Array.from({ length: STACK }, () => "<img>").join("") + '<div class="ph"></div>';
  async function drawFoot(shot, t) {
    const cam = shot.el.querySelector(".cam"), ph = cam.querySelector(".ph");
    const imgs = cam.querySelectorAll("img");
    if (!FRAMES[shot.clip]) {
      // 아직 녹화하지 않은 장면은 이름만 보여 준다(구성을 먼저 맞춰 보기).
      ph.style.display = "flex";
      ph.textContent = shot.clip;
      imgs.forEach((im) => (im.style.opacity = 0));
    } else {
      ph.style.display = "none";
      const ct = clipTime(shot, t);
      const speed = Math.abs(clipTime(shot, t + 1 / 120) - clipTime(shot, t - 1 / 120)) * 60;
      const n = speed > 1.6 ? Math.min(STACK, Math.ceil(speed / 2)) : 1;
      const waits = [];
      imgs.forEach((im, j) => {
        if (j >= n) { im.style.opacity = 0; return; }
        const src = frameSrc(shot.clip, n === 1 ? ct : ct + (j / (n - 1) - 0.5) * (speed / FPS));
        if (im.dataset.src !== src) { im.dataset.src = src; im.src = src; waits.push(im.decode().catch(() => {})); }
        im.style.opacity = 1 / (j + 1);
      });
      await Promise.all(waits);
    }
    cam.style.transform = camStyle(camAt(shot.cam, clamp((t - shot.start) / (shot.end - shot.start))));
  }

  const ready = new Set();
  const SCENE_ELS = [...new Set(shots.map((s) => s.el))];
  const len = $("#emLine").getTotalLength();
  $("#emLine").setAttribute("stroke-dasharray", len);

  window.render = async (t) => {
    // 컷 사이는 TR초 동안 겹친다: 나가는 컷은 살짝 커지며 흐려지고, 들어오는 컷은 그 위로 작아지며 또렷해진다.
    const live = shots.filter((s, i) => {
      const nx = shots[i + 1];
      const a = i === 0 || s.cut ? s.start : s.start - TR / 2;
      const b = !nx ? Infinity : nx.cut ? s.end : s.end + TR / 2;
      return t >= a && t < b;
    });
    for (const el of SCENE_ELS) set(el, { opacity: 0, filter: "none", transform: "", zIndex: 0 });
    for (const shot of live) {
      const i = shots.indexOf(shot), nx = shots[i + 1];
      if (shot.mg) {
        const scene = MG[shot.mg];
        if (!ready.has(shot.mg)) { set(scene.el, { opacity: 1 }); scene.setup?.(); ready.add(shot.mg); }
        scene.draw(t - shot.start, shot.len);
      } else await drawFoot(shot, t);
      let o = 1, s = 1, blur = 0, z = 1;
      if (i > 0 && !shot.cut && t < shot.start + TR / 2) {
        const m = ease.inOut(clamp((t - (shot.start - TR / 2)) / TR));
        o = m; s = lerp(1.05, 1, m); blur = (1 - m) * 14; z = 2;
      }
      if (nx && !nx.cut && t > shot.end - TR / 2) {
        const m = ease.inOut(clamp((t - (shot.end - TR / 2)) / TR));
        s *= 1 + 0.05 * m; blur += m * 14;
      }
      set(shot.el, { opacity: o, transform: s === 1 ? "" : `scale(${s})`, filter: blur > 0.05 ? `blur(${blur}px)` : "none", zIndex: z });
    }

    // 끝: 마지막 화면이 한 점으로 줄어들고, 그 점이 로고로 그려진 뒤 이름이 옆으로 나온다.
    const last = shots.at(-1).el;
    if (t >= END) {
      const k = p(t, END, END + 0.7, ease.inOut), s = lerp(1, 28 / 1920, k);
      set(last, { opacity: 1 - p(t, END + 0.55, END + 0.75), transformOrigin: "0 0", transform: `translate(${lerp(0, 946, k)}px, ${lerp(0, 540 - (1080 * s) / 2, k)}px) scale(${s})`, borderRadius: lerp(0, 600, k) + "px", filter: "none" });
    } else set(last, { transformOrigin: "", borderRadius: "0" });
    set("#dark", { opacity: p(t, END, END + 0.3) });
    const e0 = END + 0.6;
    set("#dot", { opacity: show(t, END + 0.5, END + 0.65, e0 + 0.1, e0 + 0.35) });
    const draw = p(t, e0 + 0.1, e0 + 1.3, ease.inOut), fill = p(t, e0 + 1.1, e0 + 1.6), slide = p(t, e0 + 1.8, e0 + 2.4);
    const size = 240, gap = 44, wordWidth = $("#endWord").getBoundingClientRect().width || 800;
    const markLeft = lerp(960 - size / 2, 960 - (size + gap + wordWidth) / 2, slide);
    set("#endMark", { left: markLeft + "px", opacity: t > e0 ? 1 : 0 });
    $("#emLine").setAttribute("stroke-dashoffset", len * (1 - draw));
    $("#emLine").setAttribute("opacity", 1 - p(t, e0 + 1.5, e0 + 1.9));
    $("#emFill").setAttribute("opacity", fill);
    set("#endWord", { left: markLeft + size + gap + "px", opacity: slide, transform: `translateX(${(1 - slide) * -30}px)` });
  };
  window.render(0);
</script>
</body>
</html>
